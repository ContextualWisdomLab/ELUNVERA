name: Refresh exact-head document manifest

on:
  push:
    branches:
      - docs/product-technical-baseline
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: elunvera-document-manifest-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: docs/product-technical-baseline
          fetch-depth: 0

      - name: Regenerate manifest from the final tracked tree
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/document-contracts.yml
          git rm .github/workflows/refresh-document-contract-manifest.yml

          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          manifest_path = Path('manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          paths = [
              Path(path)
              for path in subprocess.check_output(
                  ['git', 'ls-files'], text=True
              ).splitlines()
              if path != 'manifest.json'
          ]
          entries = []
          for path in sorted(paths, key=lambda item: item.as_posix()):
              payload = path.read_bytes()
              entries.append(
                  {
                      'path': path.as_posix(),
                      'sha256': hashlib.sha256(payload).hexdigest(),
                      'size_bytes': len(payload),
                      'line_count': len(payload.decode('utf-8').splitlines()),
                  }
              )

          manifest['generated_at'] = '2026-08-29T12:50:00Z'
          manifest['file_count'] = len(entries)
          manifest['files'] = entries
          assert manifest['self_excluded'] is True
          assert manifest['file_count'] == 55
          paths_in_manifest = {entry['path'] for entry in entries}
          assert '.github/workflows/document-contracts.yml' in paths_in_manifest
          assert '.github/workflows/refresh-document-contract-manifest.yml' not in paths_in_manifest
          assert 'schemas/asyncapi.yaml' in paths_in_manifest
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY

          git add manifest.json
          git diff --cached --check

          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          tracked = {
              path
              for path in subprocess.check_output(
                  ['git', 'ls-files'], text=True
              ).splitlines()
              if path != 'manifest.json'
          }
          entries = {entry['path']: entry for entry in manifest['files']}
          assert manifest['file_count'] == len(entries) == len(tracked) == 55
          assert set(entries) == tracked
          for path_text, entry in entries.items():
              path = Path(path_text)
              payload = path.read_bytes()
              assert hashlib.sha256(payload).hexdigest() == entry['sha256'], path
              assert len(payload) == entry['size_bytes'], path
              assert len(payload.decode('utf-8').splitlines()) == entry['line_count'], path
          PY

      - name: Commit verified final manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test "$(git ls-files | wc -l)" -eq 56
          test ! -e .github/workflows/refresh-document-contract-manifest.yml
          git commit -m "chore: refresh exact-head document manifest"
          git push origin HEAD:docs/product-technical-baseline
