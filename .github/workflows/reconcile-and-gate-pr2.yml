name: reconcile and safely gate ELUNVERA PR 2

on:
  push:
    branches:
      - docs/product-technical-baseline
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: elunvera-contract-baseline-reconcile
  cancel-in-progress: false

jobs:
  reconcile-and-gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: '2'
      FEATURE_BRANCH: docs/product-technical-baseline
    steps:
      - name: Check out latest feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: docs/product-technical-baseline
          fetch-depth: 0

      - name: Reconcile exact final tree and push
        id: reconcile
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          from pathlib import Path

          root = Path('.')
          openapi_path = root / 'schemas/openapi.yaml'
          validation_path = root / 'docs/VALIDATION_REPORT.md'
          changelog_path = root / 'CHANGELOG.md'
          workflow_path = root / '.github/workflows/document-contracts.yml'
          manifest_path = root / 'manifest.json'

          openapi = openapi_path.read_text(encoding='utf-8')
          start = openapi.index('    RecordRelationshipRequest:\n')
          end = openapi.index('    StageTransitionRequest:\n', start)
          relationship = openapi[start:end]
          relationship = re.sub(r'(?m)^          - inferred\n', '', relationship)
          evidence_header = '        evidence_reference_ids:\n          type: array\n'
          if '        evidence_reference_ids:\n          type: array\n          minItems:' not in relationship:
              if evidence_header not in relationship:
                  raise RuntimeError('relationship evidence array not found')
              relationship = relationship.replace(evidence_header, evidence_header + '          minItems: 1\n', 1)
          relationship = re.sub(
              r'(        evidence_reference_ids:\n          type: array\n          minItems:)\s*\d+',
              r'\g<1> 1',
              relationship,
              count=1,
          )
          if '          - inferred\n' in relationship:
              raise RuntimeError('manual relationship command still accepts inferred truth')
          if '          minItems: 1\n' not in relationship:
              raise RuntimeError('evidence-backed relationship assertion accepts an empty array')
          openapi_path.write_text(openapi[:start] + relationship + openapi[end:], encoding='utf-8')

          permanent_template = r'''name: document and contract checks

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: __GROUP_EXPRESSION__
  cancel-in-progress: true

jobs:
  validate:
    name: validate documentation and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reject temporary repair artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find .github/workflows tools -type f \( -name 'repair-review-round-*.yml' -o -name 'reconcile-contract-baseline*.yml' -o -name 'reconcile-and-gate-pr2.yml' -o -name 'repair_contract_review_round*.py' \) -print 2>/dev/null)"

      - name: Parse and validate YAML contracts
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml - <<'RUBY'
          openapi = YAML.safe_load(File.read('schemas/openapi.yaml'), aliases: false)
          raise 'OpenAPI version mismatch' unless openapi.fetch('openapi') == '3.2.0'
          operations = []
          openapi.fetch('paths').each do |path, item|
            item.each do |method, operation|
              next unless %w[get post put patch delete head options trace].include?(method)
              operations << [path, operation.fetch('operationId')]
            end
          end
          raise 'duplicate operationId' unless operations.map(&:last).uniq.length == operations.length
          parameters = openapi.fetch('components').fetch('parameters')
          %w[ValidAt RecordedAt KnowledgeCutoff].each do |name|
            raise "missing temporal parameter #{name}" unless parameters.key?(name)
          end
          relationship = openapi.fetch('components').fetch('schemas').fetch('RecordRelationshipRequest')
          truth_statuses = relationship.fetch('properties').fetch('truth_status').fetch('enum')
          raise 'manual relationship command must not accept inferred truth' if truth_statuses.include?('inferred')
          evidence = relationship.fetch('properties').fetch('evidence_reference_ids')
          raise 'evidence_reference_ids must reject empty arrays' unless evidence.fetch('minItems').to_i >= 1

          asyncapi = YAML.safe_load(File.read('schemas/asyncapi.yaml'), aliases: false)
          raise 'AsyncAPI version mismatch' unless asyncapi.fetch('asyncapi') == '3.1.0'
          asyncapi.fetch('operations').each do |name, operation|
            raise "#{name} must describe ELUNVERA as producer" unless operation.fetch('action') == 'send'
          end
          envelope = asyncapi.fetch('components').fetch('schemas').fetch('CloudEventEnvelope')
          required = envelope.fetch('required')
          raise 'provenance extension must be required' unless required.include?('provenanceref')
          raise 'classification extension must be required' unless required.any? { |field| %w[dataclassification data_classification].include?(field) }
          raise 'schema revision extension must be required' unless required.any? { |field| %w[schemarevision schema_revision].include?(field) }
          RUBY

      - name: Validate manifest, event schemas, and durable evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          from pathlib import Path

          tracked = set(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
          manifest_path = Path('manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          entries = {entry['path']: entry for entry in manifest['files']}
          expected_entries = tracked - {'manifest.json'}
          assert manifest['file_count'] == len(entries) == len(expected_entries)
          assert set(entries) == expected_entries
          for path_text, entry in entries.items():
              payload = Path(path_text).read_bytes()
              assert hashlib.sha256(payload).hexdigest() == entry['sha256'], path_text
              assert len(payload) == entry['size_bytes'], path_text
              assert len(payload.decode('utf-8').splitlines()) == entry['line_count'], path_text

          for event_path in sorted(Path('schemas/events').glob('*.json')):
              schema = json.loads(event_path.read_text(encoding='utf-8'))
              assert schema['$schema'] == 'https://json-schema.org/draft/2020-12/schema'
              assert schema['additionalProperties'] is False
          relationship_event = json.loads(Path('schemas/events/relationship-changed-v1.schema.json').read_text(encoding='utf-8'))
          assert 'recorded_at' in relationship_event['required']

          report = Path('docs/VALIDATION_REPORT.md').read_text(encoding='utf-8')
          tracked_match = re.search(r'Tracked repository files including `manifest\.json`: \*\*(\d+)\*\*', report)
          entries_match = re.search(r'Manifest entries excluding `manifest\.json`: \*\*(\d+)\*\*', report)
          assert tracked_match and int(tracked_match.group(1)) == len(tracked)
          assert entries_match and int(entries_match.group(1)) == len(expected_entries)
          assert 'Draft 2020-12 declaration and structural invariant validation' in report
          assert 'metaschema validation' not in report.lower()
          PY

      - name: Validate Markdown links, fences, and whitespace
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re
          from pathlib import Path

          link_pattern = re.compile(r'(?<!!)\[[^\]]+\]\(([^)]+)\)')
          placeholder = re.compile(r'\b(?:TBD|TODO|FIXME)\b')
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix in {'.md', '.yaml', '.yml', '.json'}:
                  text = path.read_text(encoding='utf-8')
                  assert not placeholder.search(text), path
              if path.suffix != '.md':
                  continue
              text = path.read_text(encoding='utf-8')
              assert text.count('```') % 2 == 0, f'unbalanced code fence: {path}'
              for target in link_pattern.findall(text):
                  target = target.strip().split()[0].strip('<>')
                  if not target or target.startswith(('#', 'http://', 'https://', 'mailto:')):
                      continue
                  local = target.split('#', 1)[0]
                  if local:
                      assert (path.parent / local).resolve().exists(), f'broken link: {path} -> {target}'
          PY
          git diff --check HEAD^
'''
          workflow_path.write_text(
              permanent_template.replace(
                  '__GROUP_EXPRESSION__',
                  '${{ github.event.pull_request.number || github.ref }}',
              ),
              encoding='utf-8',
          )

          for pattern in (
              '.github/workflows/repair-review-round-*.yml',
              '.github/workflows/reconcile-contract-baseline*.yml',
              '.github/workflows/reconcile-and-gate-pr2.yml',
              'tools/repair_contract_review_round*.py',
          ):
              for path in root.glob(pattern):
                  if path.exists():
                      path.unlink()

          final_files = sorted(path for path in root.rglob('*') if path.is_file() and '.git' not in path.parts)
          if manifest_path not in final_files:
              raise RuntimeError('manifest.json is missing')
          tracked_count = len(final_files)
          entry_count = tracked_count - 1

          validation = validation_path.read_text(encoding='utf-8')
          validation = re.sub(r'- \*\*Validation date:\*\* \d{4}-\d{2}-\d{2}', '- **Validation date:** 2026-08-29', validation, count=1)
          validation = re.sub(
              r'JSON Schema Draft 2020-12 metaschema validation',
              'JSON Schema Draft 2020-12 declaration and structural invariant validation',
              validation,
              flags=re.IGNORECASE,
          )
          validation = validation.replace(
              'Python JSON and JSON Schema validation',
              'Python JSON parsing and Draft 2020-12 declaration/invariant validation',
          )
          tracked_line = f'- Tracked repository files including `manifest.json`: **{tracked_count}**'
          entry_line = f'- Manifest entries excluding `manifest.json`: **{entry_count}**'
          validation = re.sub(r'- (?:Repository|Tracked repository) files[^\n]*', tracked_line, validation, count=1)
          validation = re.sub(r'- Manifest entries excluding `manifest\.json`[^\n]*', entry_line, validation, count=1)
          if tracked_line not in validation:
              validation += '\n' + tracked_line + '\n'
          if entry_line not in validation:
              validation += entry_line + '\n'
          if 'metaschema validation' in validation.lower():
              raise RuntimeError('validation report still overstates metaschema validation')
          validation_path.write_text(validation, encoding='utf-8')

          changelog = changelog_path.read_text(encoding='utf-8')
          fixes = (
              '- Restricted the P0 manual relationship command from accepting `inferred` truth without inference provenance and confidence.',
              '- Required at least one evidence reference when the evidence-backed relationship assertion path is selected.',
              '- Corrected documentation inventory counts and aligned validation claims with the permanent exact-head workflow.',
          )
          missing = [item for item in fixes if item not in changelog]
          if missing:
              changelog += '\n## Contract review repairs\n\n' + '\n'.join(missing) + '\n'
          changelog_path.write_text(changelog, encoding='utf-8')

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          entries = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or '.git' in path.parts or path == manifest_path:
                  continue
              payload = path.read_bytes()
              entries.append({
                  'path': path.as_posix(),
                  'sha256': hashlib.sha256(payload).hexdigest(),
                  'size_bytes': len(payload),
                  'line_count': len(payload.decode('utf-8').splitlines()),
              })
          if len(entries) != entry_count:
              raise RuntimeError(f'manifest count mismatch: {len(entries)} != {entry_count}')
          manifest['generated_at'] = '2026-08-29T00:00:00Z'
          manifest['file_count'] = len(entries)
          manifest['files'] = entries
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

          ruby -ryaml - <<'RUBY'
          openapi = YAML.safe_load(File.read('schemas/openapi.yaml'), aliases: false)
          relationship = openapi.fetch('components').fetch('schemas').fetch('RecordRelationshipRequest')
          raise 'inferred truth remains accepted' if relationship.fetch('properties').fetch('truth_status').fetch('enum').include?('inferred')
          raise 'empty evidence array remains accepted' unless relationship.fetch('properties').fetch('evidence_reference_ids').fetch('minItems').to_i >= 1
          YAML.safe_load(File.read('schemas/asyncapi.yaml'), aliases: false)
          YAML.safe_load(File.read('.github/workflows/document-contracts.yml'), aliases: false)
          RUBY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix: finalize PR 2 exact-head contract evidence"
          git push origin HEAD:docs/product-technical-baseline
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Request exact-head independent review
        shell: bash
        run: |
          set -euo pipefail
          head_sha='${{ steps.reconcile.outputs.head_sha }}'
          gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            -f body="@coderabbitai review

Review exact head \`$head_sha\`. Revalidate all previous issues against current files. Report only current issues; confirm whether the P0 relationship assertion boundary, evidence cardinality, durable validation inventory, and temporary-artifact cleanup are correct."

      - name: Evaluate exact-head merge gate without bypass
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          head_sha='${{ steps.reconcile.outputs.head_sha }}'
          gate_state='pending'
          gate_reason='exact-head checks or independent review are not complete'

          for attempt in $(seq 1 60); do
            pr_json="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
            current_head="$(jq -r '.head.sha' <<<"$pr_json")"
            current_base="$(jq -r '.base.ref' <<<"$pr_json")"
            state="$(jq -r '.state' <<<"$pr_json")"
            draft="$(jq -r '.draft' <<<"$pr_json")"
            mergeable_state="$(jq -r '.mergeable_state // "unknown"' <<<"$pr_json")"

            if [[ "$state" != 'open' ]]; then
              gate_state='closed'
              gate_reason="PR state is $state"
              break
            fi
            if [[ "$current_head" != "$head_sha" ]]; then
              gate_state='superseded'
              gate_reason="head changed from $head_sha to $current_head"
              break
            fi
            if [[ "$current_base" != 'develop' || "$draft" != 'false' ]]; then
              gate_reason="PR must target develop and be Ready for review"
              sleep 10
              continue
            fi

            checks_json="$(gh api -H 'Accept: application/vnd.github+json' "repos/$REPOSITORY/commits/$head_sha/check-runs?per_page=100")"
            contract_success="$(jq '[.check_runs[] | select(.name == "validate documentation and contracts" and .status == "completed" and .conclusion == "success")] | length' <<<"$checks_json")"
            failing_checks="$(jq '[.check_runs[] | select(.status == "completed" and (.conclusion | IN("failure", "cancelled", "timed_out", "action_required", "startup_failure", "stale")))] | length' <<<"$checks_json")"

            reviews_json="$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" | jq -s 'add')"
            exact_coderabbit_reviews="$(jq --arg sha "$head_sha" '[.[] | select((.user.login == "coderabbitai[bot]" or .user.login == "coderabbitai") and .commit_id == $sha)] | length' <<<"$reviews_json")"
            actionable_review="$(jq --arg sha "$head_sha" '[.[] | select((.user.login == "coderabbitai[bot]" or .user.login == "coderabbitai") and .commit_id == $sha and ((.body // "") | test("Actionable comments posted: [1-9]|I found these contract issues|REQUEST_CHANGES"; "i")))] | length' <<<"$reviews_json")"

            threads_json="$(gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved comments(first:20){nodes{author{login}body commit{oid}}}}}}}}' -F owner="${REPOSITORY%/*}" -F name="${REPOSITORY#*/}" -F number="$PR_NUMBER")"
            unresolved_threads="$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' <<<"$threads_json")"

            comments_json="$(gh api --paginate "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" | jq -s 'add')"
            rate_limited="$(jq '[.[] | select(.user.login == "coderabbitai[bot]" and ((.body // "") | test("Review limit reached|rate limited"; "i")))] | length' <<<"$comments_json")"

            if [[ "$contract_success" -ge 1 && "$failing_checks" -eq 0 && "$exact_coderabbit_reviews" -ge 1 && "$actionable_review" -eq 0 && "$unresolved_threads" -eq 0 && "$mergeable_state" == 'clean' ]]; then
              gate_state='pass'
              gate_reason="exact-head contract check passed; CodeRabbit reviewed the same head; no actionable or unresolved review items remain"
              break
            fi

            gate_reason="contract_success=$contract_success failing_checks=$failing_checks exact_coderabbit_reviews=$exact_coderabbit_reviews actionable_review=$actionable_review unresolved_threads=$unresolved_threads rate_limited=$rate_limited mergeable_state=$mergeable_state"
            sleep 10
          done

          echo "state=$gate_state" >> "$GITHUB_OUTPUT"
          echo "reason=$gate_reason" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Squash merge through the normal protected path
        if: steps.gate.outputs.state == 'pass'
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api --method PUT "repos/$REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f sha='${{ steps.gate.outputs.head_sha }}' \
            -f merge_method='squash' \
            -f commit_title='docs: establish ELUNVERA product and technical baseline (#2)' \
            -f commit_message='Establish the reviewed product, architecture, data, API, privacy, security, UX, operability, standards, and delivery baseline for ELUNVERA.')"
          merged="$(jq -r '.merged' <<<"$response")"
          test "$merged" = 'true'

      - name: Record a non-merge gate result
        if: steps.gate.outputs.state != 'pass'
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            -f body="Exact-head merge gate did not bypass repository policy and did not merge.

- Head: \`${{ steps.gate.outputs.head_sha }}\`
- Gate state: \`${{ steps.gate.outputs.state }}\`
- Evidence: \`${{ steps.gate.outputs.reason }}\`

The permanent contract workflow remains the source of check evidence. A later loop must re-read the live head, reviews, checks, and unresolved threads before merging."
