name: Bootstrap ELUNVERA documentation baseline

on:
  push:
    branches:
      - docs/product-technical-baseline
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: elunvera-bootstrap-baseline
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: docs/product-technical-baseline
          fetch-depth: 0

      - name: Reconstruct, verify, and materialize the baseline
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/payload.part* | tr -d '\n\r\t ' | base64 --decode > /tmp/elunvera-baseline.tar.gz
          echo "3d5ea6633df9edd20722a19f77ffbd9f4d88da462a561341363273dc405eb551  /tmp/elunvera-baseline.tar.gz" | sha256sum --check -
          test "$(tar -tzf /tmp/elunvera-baseline.tar.gz | wc -l)" -eq 55
          tar -xzf /tmp/elunvera-baseline.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-baseline.yml
          rm -f .github/workflows/permission-probe.yml
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          entries = manifest["files"]
          assert manifest["file_count"] == len(entries) == 54
          for entry in entries:
              path = Path(entry["path"])
              assert path.is_file(), f"missing manifest file: {path}"
              payload = path.read_bytes()
              assert len(payload) == entry["size_bytes"], f"size mismatch: {path}"
              assert hashlib.sha256(payload).hexdigest() == entry["sha256"], f"hash mismatch: {path}"

          for path in (
              "schemas/events/opportunity-stage-changed-v1.schema.json",
              "schemas/events/relationship-changed-v1.schema.json",
          ):
              json.loads(Path(path).read_text(encoding="utf-8"))

          required = (
              "docs/PRD.md",
              "docs/TRD.md",
              "docs/ARCHITECTURE.md",
              "docs/DATA_MODEL.md",
              "docs/API_CONTRACT.md",
              "docs/product-technical-gap-baseline.md",
              "docs/adr/README.md",
              "schemas/openapi.yaml",
              "schemas/asyncapi.yaml",
          )
          missing = [path for path in required if not Path(path).is_file()]
          assert not missing, f"missing required files: {missing}"
          PY
          test ! -e .bootstrap
          test ! -e .github/workflows/bootstrap-baseline.yml
          test ! -e .github/workflows/permission-probe.yml

      - name: Commit the verified documentation baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test "$(git ls-files --cached | wc -l)" -eq 55
          git commit -m "docs: establish ELUNVERA product and technical baseline"
          git push origin HEAD:docs/product-technical-baseline
