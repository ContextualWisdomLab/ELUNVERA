name: Repair activation queue review findings

on:
  push:
    branches:
      - product/first-slice-activation-queue
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: elunvera-activation-queue-review-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: product/first-slice-activation-queue
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Verify preimage and apply bounded review repair
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/preimage.sha256 <<'EOF'
          aa0ebf444b05fbeaeac25366b2623e9549bcc52e8838ebe54eedccedd950f4e7  .github/workflows/ci.yml
          893b6007e68dd707b19fa7cc3eb8e34c3cabe7c4709382c8f2a93df88b38067d  scripts/serve.py
          bcd010a9473c89d3de8413273420cf0fbf15fe24c276c850c9b74f3715e38971  src/elunvera/queue.py
          fd08abf12d5837f3b59eb920d490cb44cc78fdbac067fef5db1497b189e6847d  tests/test_queue.py
          82c23b59fec194a578da8c89c88bbc541eb5068fcf226b1cd46d6be2e89ac37c  web/app.js
          54807000609a65f182169e636914368e8772fd507a204e5b37edff0147a3ab29  web/index.html
          EOF
          sha256sum --check /tmp/preimage.sha256

          tr -d '\n\r\t ' < .bootstrap/review-fixes.patch.gz.b64 \
            | base64 --decode \
            | gzip -d > /tmp/review-fixes.patch
          echo "e20a176adfcc46d05222b7949b8c6eb6f57b2411527abb774d911511f6e0cd6d  /tmp/review-fixes.patch" \
            | sha256sum --check -
          git apply --check /tmp/review-fixes.patch
          git apply /tmp/review-fixes.patch
          git diff --check

          test -f requirements-dev.txt
          test -f package.json
          test -f tests/test_server.py
          test -f tests/test_app.mjs
          test -f tests/test_docstrings.py
          test -f web/bootstrap.js

      - name: Install pinned Python test dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install --no-input -r requirements-dev.txt

      - name: Run Python tests with complete production coverage
        run: |
          set -euo pipefail
          python -m coverage erase
          python -m coverage run --branch -m pytest -q
          python -m coverage report \
            --include='src/elunvera/*,scripts/serve.py' \
            --fail-under=100

      - name: Compile Python entry points
        run: python -m py_compile scripts/serve.py src/elunvera/queue.py

      - name: Run browser tests with complete production coverage
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include='web/*.js'
          --test-coverage-lines=100
          --test-coverage-branches=100
          --test-coverage-functions=100
          tests/test_app.mjs

      - name: Commit verified repair and remove transfer artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/repair-activation-queue-review.yml
          rm -f .coverage
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check

          python - <<'PY'
          import subprocess

          expected = {
              '.bootstrap/review-fixes.patch.gz.b64',
              '.github/workflows/ci.yml',
              '.github/workflows/repair-activation-queue-review.yml',
              'package.json',
              'requirements-dev.txt',
              'scripts/serve.py',
              'src/elunvera/queue.py',
              'tests/test_app.mjs',
              'tests/test_docstrings.py',
              'tests/test_queue.py',
              'tests/test_server.py',
              'web/app.js',
              'web/bootstrap.js',
              'web/index.html',
          }
          actual = set(
              subprocess.check_output(
                  ['git', 'diff', '--cached', '--name-only'], text=True
              ).splitlines()
          )
          assert actual == expected, (sorted(actual), sorted(expected))
          PY

          test "$(git ls-files --cached | wc -l)" -eq 21
          test ! -e .bootstrap
          test ! -e .github/workflows/repair-activation-queue-review.yml
          test ! -e .coverage
          git commit -m "fix: harden activation queue review boundaries"
          git push origin HEAD:product/first-slice-activation-queue
