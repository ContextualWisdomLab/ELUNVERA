name: product-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  activation-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Test activation queue
        run: python -m pytest -q
      - name: Compile serve script
        run: python -m py_compile scripts/serve.py src/elunvera/queue.py
