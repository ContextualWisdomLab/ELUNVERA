name: product-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-ci-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  activation-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt, llvm-tools-preview

      - name: Install pinned Rust coverage tool
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad
        with:
          tool: cargo-llvm-cov@0.8.5

      - name: Validate Rust foundation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          cargo doc --workspace --all-features --no-deps
          cargo llvm-cov --workspace --all-features --branch --json \
            --output-path target/llvm-cov-target/coverage.json \
            --fail-under-lines 100 --fail-under-functions 100 --fail-under-regions 100
          python - <<'PY'
          import json
          from pathlib import Path

          totals = json.loads(
              Path("target/llvm-cov-target/coverage.json").read_text(encoding="utf-8")
          )["data"][0]["totals"]
          branches = totals["branches"]
          assert branches["count"] == branches["covered"], branches
          PY

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install hash-locked Python test dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: >-
          python -m pip install --no-input --only-binary=:all:
          --require-hashes -r requirements-ci.txt

      - name: Run Python tests with complete production coverage
        run: |
          python -m coverage run --branch -m pytest -q
          python -m coverage report \
            --include='src/elunvera/*,scripts/serve.py' \
            --fail-under=100

      - name: Compile Python entry points
        run: python -m py_compile scripts/serve.py src/elunvera/queue.py

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5
        with:
          node-version: "24"

      - name: Run browser tests with complete production coverage
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include='web/*.js'
          --test-coverage-lines=100
          --test-coverage-branches=100
          --test-coverage-functions=100
          tests/test_app.mjs
