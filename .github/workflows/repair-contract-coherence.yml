name: Repair ELUNVERA contract coherence

on:
  push:
    branches:
      - docs/product-technical-baseline
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: elunvera-contract-coherence-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: docs/product-technical-baseline
          fetch-depth: 0

      - name: Verify preimage, apply bounded patch, and validate contracts
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/preimage.sha256 <<'EOF'
          335c872458d18069fd76569b0eb49ff1062c6f6b44ef2ba58e714e207ab1f098  CHANGELOG.md
          8c23a286938b7e44c5e6990104b249fe4dabb499f47f38566407cb324ddd7170  docs/API_CONTRACT.md
          13f332255239f79e773bcce00a6b19a2051ff5cb7273ae0e24ca6413a38ea0fc  docs/TRD.md
          116e9549728e8b374ee492ad622ade97eec33e4bfc49d0b3e238109af1ef512c  docs/VALIDATION_REPORT.md
          2670697f82e5046f07e9938bae12f95f59bba7c66113990a826820149b8b00a6  schemas/asyncapi.yaml
          1a65236b1a0703abbe74c568692c851336393c62e84e6977f13356a5a16f03b1  schemas/events/opportunity-stage-changed-v1.schema.json
          5bd9b1504d8c1ad1c9c3df4cd1d8a39e31b4fc15a10633707da222be6814dcb0  schemas/events/relationship-changed-v1.schema.json
          03adaef269648275bd5d9e44d99a7f990f18efbf05a40771b628b971de79e8fb  schemas/openapi.yaml
          bdabc6bb01216905f6bac94520c4f3e8d5206984744846ba764be7f70b4b2104  manifest.json
          EOF
          sha256sum --check /tmp/preimage.sha256

          tr -d '\n\r\t ' < .bootstrap/contract-fix.patch.gz.b64 \
            | base64 --decode \
            | gzip -d > /tmp/contract-fix.patch
          echo "60663ec230643acf1a6fefd7a56a0cff8f29b2831b9bdfecfdf92db073b4bd62  /tmp/contract-fix.patch" \
            | sha256sum --check -
          git apply --check /tmp/contract-fix.patch
          git apply /tmp/contract-fix.patch

          ruby <<'RUBY'
          require 'yaml'

          openapi = YAML.safe_load(File.read('schemas/openapi.yaml'), aliases: false)
          raise 'OpenAPI version mismatch' unless openapi['openapi'] == '3.2.0'

          methods = %w[get post put patch delete options head trace]
          operations = []
          openapi.fetch('paths').each do |path, item|
            item.each do |method, operation|
              next unless methods.include?(method)
              operations << [method.upcase, "/v1#{path}", operation.fetch('operationId')]
            end
          end
          expected = [
            ['GET', '/v1/accounts'],
            ['POST', '/v1/accounts'],
            ['GET', '/v1/accounts/{account_id}'],
            ['PATCH', '/v1/accounts/{account_id}'],
            ['POST', '/v1/relationships'],
            ['POST', '/v1/opportunities/{opportunity_id}/stage-transitions']
          ].sort
          raise 'OpenAPI/narrative operation parity mismatch' unless operations.map { |method, path, _| [method, path] }.sort == expected
          raise 'duplicate operationId' unless operations.map(&:last).uniq.length == operations.length

          ['/accounts', '/accounts/{account_id}'].each do |path|
            operation = openapi.fetch('paths').fetch(path).fetch('get')
            refs = operation.fetch('parameters').filter_map { |parameter| parameter['$ref'] }
            %w[ValidAt RecordedAt KnowledgeCutoff].each do |name|
              raise "missing temporal parameter #{name}" unless refs.include?("#/components/parameters/#{name}")
            end
            headers = operation.fetch('responses').fetch('200').fetch('headers')
            %w[X-ELUNVERA-Valid-At X-ELUNVERA-Recorded-At X-ELUNVERA-Knowledge-Cutoff].each do |name|
              raise "missing temporal response header #{name}" unless headers.key?(name)
            end
          end

          openapi.fetch('paths').each do |_path, item|
            item.each do |method, operation|
              next unless %w[post patch put delete].include?(method)
              refs = operation.fetch('parameters').filter_map { |parameter| parameter['$ref'] }
              raise 'missing correlation ID' unless refs.include?('#/components/parameters/CorrelationId')
              raise 'missing idempotency key' unless refs.include?('#/components/parameters/IdempotencyKey')
            end
          end

          asyncapi = YAML.safe_load(File.read('schemas/asyncapi.yaml'), aliases: false)
          raise 'AsyncAPI version mismatch' unless asyncapi['asyncapi'] == '3.1.0'
          expected_operations = %w[publishOpportunityStageChanged publishRelationshipChanged]
          raise 'AsyncAPI operation set mismatch' unless asyncapi.fetch('operations').keys.sort == expected_operations
          raise 'AsyncAPI producer direction mismatch' unless asyncapi.fetch('operations').values.all? { |operation| operation['action'] == 'send' }
          envelope = asyncapi.fetch('components').fetch('schemas').fetch('CloudEventEnvelope')
          %w[dataclassification schemarevision].each do |name|
            raise "missing envelope metadata #{name}" unless envelope.fetch('required').include?(name)
          end
          RUBY

          python3 <<'PY'
          import hashlib
          import json
          from pathlib import Path

          for event_path in (
              Path('schemas/events/relationship-changed-v1.schema.json'),
              Path('schemas/events/opportunity-stage-changed-v1.schema.json'),
          ):
              schema = json.loads(event_path.read_text(encoding='utf-8'))
              assert 'recorded_at' in schema['required'], event_path
              assert schema['properties']['recorded_at']['format'] == 'date-time', event_path

          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          assert manifest['file_count'] == len(manifest['files']) == 54
          for entry in manifest['files']:
              path = Path(entry['path'])
              payload = path.read_bytes()
              assert hashlib.sha256(payload).hexdigest() == entry['sha256'], path
              assert len(payload) == entry['size_bytes'], path
              assert len(payload.decode('utf-8').splitlines()) == entry['line_count'], path
          PY

          test "$(git ls-files | wc -l)" -eq 57
          git diff --check

      - name: Commit verified repair and remove transfer artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/repair-contract-coherence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test "$(git ls-files --cached | wc -l)" -eq 55
          git commit -m "fix: align HTTP and event contract coherence"
          git push origin HEAD:docs/product-technical-baseline
